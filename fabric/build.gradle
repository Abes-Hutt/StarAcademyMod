plugins {
    id 'com.github.johnrengelman.shadow'
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.0'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = file("src/main/resources/academy-fabric.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")
    modImplementation("net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version")
    modImplementation("dev.architectury:architectury-fabric:$rootProject.architectury_api_version")

    modImplementation("com.cobblemon:fabric:1.6.1+1.21.1")
    modImplementation("net.fabricmc:fabric-language-kotlin:1.11.0+kotlin.2.0.0")

    modImplementation("maven.modrinth:enhanced-celestials:6.0.2.0-fabric")
    modImplementation("maven.modrinth:corgilib:1.21.1-5.0.0.6-Fabric")
    modImplementation("maven.modrinth:data-anchor:2.0.0.12-fabric")

    modImplementation("maven.modrinth:eternal-starlight:0.5.1+1.21.1+fabric")

    modImplementation("software.bernie.geckolib:geckolib-fabric-1.21.1:4.7.5.1")

    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    atAccessWideners.add "academy-common.accesswidener"
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Abes-Hutt/StarAcademyMod")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            groupId = rootProject.maven_group
            artifactId = rootProject.archives_name.toLowerCase()
            version = "mc${rootProject.minecraft_version}-v${rootProject.mod_version}${getBuildNumber()}-${project.name}"
            from components.java
        }
    }
}

tasks.register('printVersion') {
    println "mc$rootProject.minecraft_version-v$rootProject.mod_version${getBuildNumber()}-fabric"
}

static def getBuildNumber() {
    if(System.getenv("GITHUB_RUN_NUMBER") != null) {
        return "." + System.getenv("GITHUB_RUN_NUMBER").toString()
    }

    return ""
}
