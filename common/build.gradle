architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/academy-common.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    modImplementation "com.cobblemon:mod:1.6.1+1.21.1"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.7.5.1"
    modImplementation annotationProcessor("io.wispforest:owo-lib:0.12.15.4+1.21")
    modCompileOnly include("io.wispforest:owo-sentinel:0.12.15.4+1.21")

    implementation files("jars/molang-1.1.18.jar")
    modImplementation files("jars/pokeblocks-1.4.0-1.21.1.jar")
    modImplementation files("jars/TropiWiki-1.2.2r.jar")
    modImplementation files("jars/itemzoomer-1.1.0-1.21.1.jar")
    modImplementation files("jars/display-1.0.1-fabric-1.21.1.jar")
    modImplementation files("jars/modernfix-fabric-5.21.0+mc1.21.1.jar")
    modImplementation files("jars/journeymap-fabric-1.21.1-6.0.0-beta.47.jar")
    modImplementation files("jars/numismatic-overhaul-0.3.3+1.21.jar")
}

