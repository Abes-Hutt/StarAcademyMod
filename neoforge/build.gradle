plugins {
    id 'com.github.johnrengelman.shadow'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge("net.neoforged:neoforge:$rootProject.neoforge_version")
    modImplementation("dev.architectury:architectury-neoforge:$rootProject.architectury_api_version")
    implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.3"))

    modImplementation("com.cobblemon:neoforge:1.7.0+1.21.1")

    modImplementation("maven.modrinth:enhanced-celestials:6.0.2.0-neoforge")
    modImplementation("maven.modrinth:corgilib:1.21.1-5.0.0.6-NeoForge")
    modImplementation("maven.modrinth:data-anchor:2.0.0.12-neoforge")

    modImplementation("maven.modrinth:eternal-starlight:0.5.1+1.21.1+neoforge")

    modImplementation("software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5.1")

    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    atAccessWideners.add "dailyshop-common.accesswidener"
}
